# Sushi — prebuilt image, no local build.
#
#   curl -fsSLO https://raw.githubusercontent.com/sarakplaystore/sushi/main/docker-compose.prebuilt.yml
#   docker compose -f docker-compose.prebuilt.yml up -d
#
# Everything (Web UI, API, WebSocket SSH/RDP, guacd) starts in one command. Data
# lives in the `sushi-data` volume — keep and back it up, it holds auth.json and
# the encrypted vault. Set PORT in a .env next to this file to change the port.
services:
  sushi:
    image: ${SUSHI_IMAGE:-ghcr.io/sarakplaystore/sushi:latest}
    container_name: sushi
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - DATA_DIR=/app/data
      - SUSHI_SERVER_VAULT=${SUSHI_SERVER_VAULT:-true}
      - SUSHI_AUTH_USERNAME=${SUSHI_AUTH_USERNAME:-}
      - SUSHI_AUTH_PASSWORD=${SUSHI_AUTH_PASSWORD:-}
      - SUSHI_AUTH_SECRET=${SUSHI_AUTH_SECRET:-}
      - SUSHI_STORAGE_BACKEND=${SUSHI_STORAGE_BACKEND:-auto}
      - SUSHI_TURSO_DATABASE_URL=${SUSHI_TURSO_DATABASE_URL:-}
      - SUSHI_TURSO_AUTH_TOKEN=${SUSHI_TURSO_AUTH_TOKEN:-}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - SUSHI_FIRESTORE_PROJECT_ID=${SUSHI_FIRESTORE_PROJECT_ID:-}
      - SUSHI_FIRESTORE_DATABASE_ID=${SUSHI_FIRESTORE_DATABASE_ID:-}
      - SUSHI_FIRESTORE_CREDENTIALS_JSON=${SUSHI_FIRESTORE_CREDENTIALS_JSON:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - SUSHI_REDIS_REST_URL=${SUSHI_REDIS_REST_URL:-}
      - SUSHI_REDIS_REST_TOKEN=${SUSHI_REDIS_REST_TOKEN:-}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - KV_REST_API_URL=${KV_REST_API_URL:-}
      - KV_REST_API_TOKEN=${KV_REST_API_TOKEN:-}
      - SUSHI_STORAGE_PREFIX=${SUSHI_STORAGE_PREFIX:-}
      - SUSHI_GATEWAY_TOKEN=${SUSHI_GATEWAY_TOKEN:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - BLOCK_PRIVATE_NETWORKS=${BLOCK_PRIVATE_NETWORKS:-false}
    volumes:
      - sushi-data:/app/data
    depends_on:
      - guacd
    networks:
      - sushi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/system/capabilities"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: sushi-guacd
    restart: unless-stopped
    environment:
      - GUACD_LOG_LEVEL=info
    networks:
      - sushi-net

volumes:
  sushi-data:

networks:
  sushi-net:
    driver: bridge
