# Sushi Gateway on Render — the WebSocket PTY companion for a Sushi UI deployed
# on Vercel. Vercel functions cannot accept a WebSocket upgrade, so one small
# always-on process elsewhere provides the native PTY (`vim`, `htop`, `tmux`,
# terminal resize) and team-shared shells.
#
#   Render dashboard → New + → Blueprint → pick this repository
#   (or use the "Deploy to Render" button in the README)
#
# Render reads this file and creates the `sushi-gateway` web service from
# Dockerfile.gateway. SUSHI_GATEWAY_TOKEN is generated for you; copy it from
# the service's Environment tab and enter it in Sushi → Settings → Gateway,
# together with the public service URL (https://your-gateway.onrender.com).
# A gateway-only process defaults ALLOWED_ORIGIN to
# https://sushi-lyart-three.vercel.app when no variable is set. If your Sushi
# frontend has another origin, add ALLOWED_ORIGIN in the Environment tab.
#
# Two Render-specific notes:
#   * A free instance may sleep after ~15 minutes idle. The optional keep-awake
#     toggle only attempts pings while Sushi's gateway settings panel is open.
#   * This blueprint does not deploy guacd. SSH PTY still works, and RDP can use
#     the browser's IronRDP WebAssembly client. A separately hosted guacd may be
#     connected over an appropriate private network; review your provider's plan.
services:
  - type: web
    name: sushi-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.gateway
    dockerContext: .
    healthCheckPath: /api/system/capabilities
    envVars:
      # Render generates a 256-bit base64 secret once (stronger than 24-byte
      # hex), preserving any existing value, even if blank. Set a strong value
      # explicitly if blank; otherwise copy it privately from Environment.
      #   dashboard → sushi-gateway → Environment
      #     https://dashboard.render.com
      #   how env vars and generated secrets work
      #     https://render.com/docs/configure-environment-variables
      - key: SUSHI_GATEWAY_TOKEN
        generateValue: true
      # ALLOWED_ORIGIN is deliberately not a Blueprint-managed literal or a
      # creation-time prompt. server.ts supplies the default when it is absent;
      # a service variable overrides it and survives future Blueprint syncs.
      - key: GATEWAY_ONLY
        value: "true"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Only useful if you expose a guacd instance Render can address.
      - key: GUACD_HOST
        value: 127.0.0.1
      - key: GUACD_PORT
        value: "4822"
